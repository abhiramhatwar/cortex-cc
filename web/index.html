<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cortex-cc · Supervisor Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; }
    .badge-available { background:#16a34a22; color:#4ade80; border:1px solid #16a34a55; }
    .badge-busy      { background:#dc262622; color:#f87171; border:1px solid #dc262655; }
    .badge-break     { background:#d9770622; color:#fb923c; border:1px solid #d9770655; }
    .badge-queued    { background:#1d4ed822; color:#60a5fa; border:1px solid #1d4ed855; }
    .badge-active    { background:#16a34a22; color:#4ade80; border:1px solid #16a34a55; }
    .badge-sla       { background:#dc262622; color:#f87171; border:1px solid #dc262655; }
    .sentiment-bar { height:6px; border-radius:3px; }
    .chat-bubble-user { background:#1d4ed8; border-radius:16px 16px 4px 16px; }
    .chat-bubble-ai   { background:#1e293b; border:1px solid #334155; border-radius:16px 16px 16px 4px; }
    ::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-track { background:#0f172a; }
    ::-webkit-scrollbar-thumb { background:#334155; border-radius:2px; }
    .pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  </style>
</head>
<body class="min-h-screen p-4">

  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-violet-600 flex items-center justify-center text-sm font-bold">C</div>
      <div>
        <h1 class="text-lg font-bold text-white">cortex-cc</h1>
        <p class="text-xs text-slate-400">On-Prem AI Contact Center Copilot</p>
      </div>
    </div>
    <div class="flex items-center gap-2 text-xs text-slate-400">
      <div id="ws-status" class="w-2 h-2 rounded-full bg-red-500 pulse"></div>
      <span id="ws-label">Connecting...</span>
    </div>
  </div>

  <!-- Stats Row -->
  <div class="grid grid-cols-4 gap-4 mb-6">
    <div class="card p-4">
      <p class="text-xs text-slate-400 mb-1">Active Calls</p>
      <p id="stat-active" class="text-3xl font-bold text-white">0</p>
    </div>
    <div class="card p-4">
      <p class="text-xs text-slate-400 mb-1">In Queue</p>
      <p id="stat-queued" class="text-3xl font-bold text-blue-400">0</p>
    </div>
    <div class="card p-4">
      <p class="text-xs text-slate-400 mb-1">Available Agents</p>
      <p id="stat-available" class="text-3xl font-bold text-green-400">0</p>
    </div>
    <div class="card p-4">
      <p class="text-xs text-slate-400 mb-1">SLA Breaches</p>
      <p id="stat-sla" class="text-3xl font-bold text-red-400">0</p>
    </div>
  </div>

  <div class="grid grid-cols-3 gap-4">

    <!-- Live Call Queue -->
    <div class="col-span-2 card p-4 flex flex-col" style="height:420px">
      <h2 class="text-sm font-semibold text-white mb-3">Live Call Queue</h2>
      <div class="overflow-y-auto flex-1">
        <table class="w-full text-xs">
          <thead>
            <tr class="text-slate-500 border-b border-slate-700">
              <th class="text-left py-2 font-medium">Call ID</th>
              <th class="text-left py-2 font-medium">Caller</th>
              <th class="text-left py-2 font-medium">Queue</th>
              <th class="text-left py-2 font-medium">Status</th>
              <th class="text-left py-2 font-medium">Wait</th>
              <th class="text-left py-2 font-medium">Sentiment</th>
            </tr>
          </thead>
          <tbody id="calls-table"></tbody>
        </table>
      </div>
    </div>

    <!-- Agent Status -->
    <div class="card p-4 flex flex-col" style="height:420px">
      <h2 class="text-sm font-semibold text-white mb-3">Agents</h2>
      <div id="agents-list" class="overflow-y-auto flex-1 space-y-2"></div>
    </div>

  </div>

  <!-- Alerts -->
  <div id="alerts-box" class="mt-4 space-y-2"></div>

  <!-- AI Copilot Chat -->
  <div class="mt-4 card p-4" style="height:340px; display:flex; flex-direction:column;">
    <div class="flex items-center gap-2 mb-3">
      <div class="w-5 h-5 rounded bg-violet-600 flex items-center justify-center text-xs">AI</div>
      <h2 class="text-sm font-semibold text-white">AI Copilot</h2>
      <span class="text-xs text-slate-500">— powered by Ollama · Llama 3.1:8b · on-prem</span>
    </div>
    <div id="chat-messages" class="flex-1 overflow-y-auto space-y-3 mb-3 pr-1"></div>
    <div class="flex gap-2">
      <input id="chat-input" type="text"
        placeholder='Ask anything: "Which agents are struggling?" "Route C-123 to Sarah."'
        class="flex-1 bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-violet-500" />
      <button onclick="sendChat()"
        class="bg-violet-600 hover:bg-violet-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
        Ask
      </button>
    </div>
  </div>

<script>
  const state = { calls: {}, agents: {}, slaCount: 0 };

  // ── WebSocket ──────────────────────────────────────────────────────────────
  function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => {
      document.getElementById('ws-status').className = 'w-2 h-2 rounded-full bg-green-500';
      document.getElementById('ws-label').textContent = 'Live';
    };
    ws.onclose = () => {
      document.getElementById('ws-status').className = 'w-2 h-2 rounded-full bg-red-500 pulse';
      document.getElementById('ws-label').textContent = 'Reconnecting...';
      setTimeout(connect, 2000);
    };
    ws.onmessage = ({ data }) => {
      const evt = JSON.parse(data);
      handleEvent(evt);
    };
  }

  function handleEvent(evt) {
    const p = evt.payload;
    switch (evt.type) {
      case 'call_queued':
      case 'call_answered':
      case 'call_updated':
      case 'call_routed':
      case 'call_flagged':
        state.calls[p.id] = p;
        break;
      case 'call_completed':
      case 'call_abandoned':
        delete state.calls[p.id];
        break;
      case 'sla_breached':
        state.slaCount++;
        pushAlert(`⚠ SLA breach — ${p.caller_name} (${p.id}) has been waiting ${p.wait_seconds}s in ${p.queue_name}`);
        break;
      case 'sentiment_update':
        if (p.sentiment < -0.3) {
          pushAlert(`😤 Negative sentiment on call ${p.id} with ${p.caller_name}`);
        }
        if (state.calls[p.id]) state.calls[p.id].sentiment = p.sentiment;
        break;
    }
    render();
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  function render() {
    const calls = Object.values(state.calls);
    const activeCalls = calls.filter(c => c.status === 'active');
    const queuedCalls = calls.filter(c => c.status === 'queued');

    // fetch agents periodically — set via REST
    document.getElementById('stat-active').textContent = activeCalls.length;
    document.getElementById('stat-queued').textContent = queuedCalls.length;
    document.getElementById('stat-sla').textContent = state.slaCount;

    // calls table
    const tbody = document.getElementById('calls-table');
    tbody.innerHTML = calls.map(c => {
      const wait = c.status === 'queued' ? c.wait_seconds : c.talk_seconds;
      const sentColor = c.sentiment > 0.3 ? '#4ade80' : c.sentiment < -0.3 ? '#f87171' : '#fb923c';
      const slaFlag = c.sla_breached ? ' <span class="text-red-400">⚠</span>' : '';
      return `<tr class="border-b border-slate-800 hover:bg-slate-800/40">
        <td class="py-2 font-mono text-violet-400">${c.id}${slaFlag}</td>
        <td class="py-2">${c.caller_name || c.caller_number}</td>
        <td class="py-2 text-slate-400">${c.queue_name}</td>
        <td class="py-2"><span class="badge-${c.status} px-2 py-0.5 rounded-full text-xs">${c.status}</span></td>
        <td class="py-2 ${wait > 90 ? 'text-red-400 font-bold' : ''}">${wait}s</td>
        <td class="py-2">
          <div class="w-20 bg-slate-700 sentiment-bar">
            <div class="sentiment-bar" style="width:${Math.round((c.sentiment+1)/2*100)}%;background:${sentColor}"></div>
          </div>
        </td>
      </tr>`;
    }).join('');
  }

  // ── Agents (polled via REST every 5s) ────────────────────────────────────
  async function pollAgents() {
    try {
      const res = await fetch('/api/agents');
      const agents = await res.json();
      const available = agents.filter(a => a.status === 'available').length;
      document.getElementById('stat-available').textContent = available;
      document.getElementById('agents-list').innerHTML = agents.map(a => `
        <div class="flex items-center justify-between p-2 rounded-lg bg-slate-800/50">
          <div>
            <p class="text-xs font-medium text-white">${a.name}</p>
            <p class="text-xs text-slate-500">${a.calls_handled} calls · ${Math.round(a.avg_handle_time)}s avg</p>
          </div>
          <span class="badge-${a.status} px-2 py-0.5 rounded-full text-xs">${a.status}</span>
        </div>`).join('');
    } catch {}
  }

  // ── Alerts ────────────────────────────────────────────────────────────────
  function pushAlert(msg) {
    const box = document.getElementById('alerts-box');
    const el = document.createElement('div');
    el.className = 'card p-3 text-xs text-red-300 border-red-900';
    el.textContent = msg;
    box.prepend(el);
    setTimeout(() => el.remove(), 12000);
  }

  // ── AI Chat ───────────────────────────────────────────────────────────────
  async function sendChat() {
    const input = document.getElementById('chat-input');
    const msg = input.value.trim();
    if (!msg) return;
    input.value = '';
    appendChat('user', msg);
    const thinking = appendChat('ai', '...');
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg })
      });
      const data = await res.json();
      thinking.querySelector('p').textContent = data.reply || data.error;
    } catch {
      thinking.querySelector('p').textContent = 'Error reaching AI.';
    }
  }

  function appendChat(role, text) {
    const box = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
    div.innerHTML = `<div class="chat-bubble-${role === 'user' ? 'user' : 'ai'} px-4 py-2 max-w-lg">
      <p class="text-sm text-white">${text}</p>
    </div>`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    return div;
  }

  document.getElementById('chat-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendChat();
  });

  connect();
  pollAgents();
  setInterval(pollAgents, 5000);
</script>
</body>
</html>
