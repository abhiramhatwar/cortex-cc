services:
  cortex:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/cortex.db
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b
      - WHISPER_URL=http://whisper:8001
      - SENTIMENT_URL=http://sentiment:5001
    volumes:
      - cortex-data:/data
    depends_on:
      - ollama
      - whisper
      - sentiment

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

  whisper:
    build:
      context: ./whisper
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - WHISPER_MODEL=base
      - WHISPER_DEVICE=cpu
      - PORT=8001
    volumes:
      - whisper-models:/root/.cache/whisper

  sentiment:
    build:
      context: ./sentiment
      dockerfile: Dockerfile
    ports:
      - "5001:5001"

volumes:
  cortex-data:
  ollama-models:
  whisper-models:
