services:
  cortex:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/cortex.db
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b
    volumes:
      - cortex-data:/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

  sentiment:
    build:
      context: ./sentiment
      dockerfile: Dockerfile
    ports:
      - "5001:5001"

volumes:
  cortex-data:
  ollama-models:
